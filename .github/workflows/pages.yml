name: Publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download original resources
        run: bash fetch-assets.sh
      - name: Preserve resources in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Сохранить оригинальные ресурсы Figma и шрифты"
            git push
          fi
      - name: Validate scripts and prepare static site
        run: |
          node --check app.js
          node --check demo-data.js
          mkdir -p dist
          cp index.html styles.css app.js demo-data.js dist/
          cp -R assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
